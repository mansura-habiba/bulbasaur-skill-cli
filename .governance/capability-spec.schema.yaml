# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
#
# capability-spec.schema.yaml — the per-feature contract
#
# A Capability is a bounded area of functionality. Many task cards live inside one capability.
# Seniors author capability specs; juniors read them to understand the area their task touches.
#
# Relationship to task cards:
#   capability  : 1 ─── many : task_card
#   capability.contract  →  defines what task cards in this area must respect
#   task_card.parent_capability  →  points back to a capability file
#
# This schema is enforced in CI. Task cards whose parent_capability does not resolve, or whose
# changes violate the capability's forbidden list, fail the merge gate.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://bulbasaur-skill-cli/.governance/capability-spec.schema.yaml"
title: "Capability Spec"
type: object
additionalProperties: false

required:
  - id
  - name
  - purpose
  - owner
  - contract
  - tasks_must
  - forbidden

properties:

  # -------------------------------------------------------------------------
  # Identity
  # -------------------------------------------------------------------------

  id:
    type: string
    description: kebab-case slug. Used as the filename and the cross-reference key.
    pattern: "^[a-z][a-z0-9-]+[a-z0-9]$"
    examples: ["skill-registry", "policy-engine", "evidence-logger"]

  name:
    type: string
    description: Human-readable name for the capability. Shown in dashboards, PRs, reviews.
    maxLength: 80

  purpose:
    type: string
    minLength: 100
    description: |
      What this capability exists to do, and what would break if it didn't. minLength enforces
      that this is a real description, not a placeholder. This is the "bigger picture" every
      junior reads when starting a task in this area.

  tier:
    type: string
    enum: [local, team, org, regulated]
    default: team
    description: Strictness tier. Tasks within this capability inherit the tier unless overridden.

  philosophy_link:
    type: string
    default: ".governance/philosophy.md"
    description: |
      Path to the philosophy doc. Default is the repo's main philosophy. Override only for
      capabilities operating under a different regulatory regime.

  # -------------------------------------------------------------------------
  # Contract — the stable interface other capabilities depend on
  # -------------------------------------------------------------------------

  contract:
    type: object
    description: |
      The capability's public contract. Changes here are breaking changes — task cards modifying
      this section require tier_approver sign-off and a migration plan.
    required:
      - inputs
      - outputs
    additionalProperties: false
    properties:
      inputs:
        type: array
        description: What this capability accepts. Schema references, type names, or event names.
        items:
          type: object
          required: [name, shape]
          additionalProperties: false
          properties:
            name: { type: string }
            shape:
              type: string
              description: Schema path, type name, or inline JSON Schema reference.
            description: { type: string }
      outputs:
        type: array
        description: What this capability produces. Same structure as inputs.
        items:
          type: object
          required: [name, shape]
          additionalProperties: false
          properties:
            name: { type: string }
            shape: { type: string }
            description: { type: string }
      invariants:
        type: array
        description: |
          Properties that must hold across all executions of this capability. Each invariant
          should map to at least one contract test in tests/contract/.
        items: { type: string }

  # -------------------------------------------------------------------------
  # What every task in this capability must do
  # -------------------------------------------------------------------------

  tasks_must:
    type: object
    description: |
      Inherited requirements that every task card under this capability inherits at file-time.
      The task card validator checks task cards against these — non-conforming cards are rejected.
    additionalProperties: false
    properties:
      pass_contract_tests:
        type: array
        items: { type: string }
        description: |
          Test IDs that every task in this capability must pass at merge time, regardless of what
          the task adds. These are the regression gates.
      preserve_invariants:
        type: array
        items: { type: string }
        description: References to invariants in contract.invariants that must continue to hold.
      use_patterns:
        type: array
        items: { type: string }
        description: |
          Required design patterns (e.g. "factory for new adapters", "no global state").
          Surface as preferred_patterns in task cards.
      avoid_dependencies:
        type: array
        items: { type: string }
        description: Libraries or modules that tasks in this area must not introduce.

  # -------------------------------------------------------------------------
  # Forbidden — capability-level non-goals
  # -------------------------------------------------------------------------

  forbidden:
    type: array
    minItems: 1
    items: { type: string }
    description: |
      Things that NO task within this capability does, ever. At least one entry required —
      this is the capability-level equivalent of task non_goals, and it constrains every
      task card filed against this capability.

  # -------------------------------------------------------------------------
  # Evidence and runtime concerns
  # -------------------------------------------------------------------------

  evidence_requirements:
    type: object
    description: |
      What every execution of this capability must record for audit/replay. Required at
      tier `org` and `regulated`.
    additionalProperties: false
    properties:
      audit_events:
        type: array
        items: { type: string }
        description: Named events that must be logged on every execution path.
      retention_days:
        type: integer
        description: How long evidence is retained. Default per tier; override here if stricter.

  runtime_constraints:
    type: object
    description: Non-functional contracts for this capability.
    additionalProperties: false
    properties:
      performance:
        type: string
        description: e.g. "p95 < 200ms for the validate endpoint"
      security:
        type: string
      observability:
        type: string

  # -------------------------------------------------------------------------
  # Ownership and bookkeeping
  # -------------------------------------------------------------------------

  owner:
    type: object
    required:
      - lead
    additionalProperties: false
    properties:
      lead:
        type: string
        description: Single human who owns this capability. Not a group alias.
      backup:
        type: string
        description: Secondary contact when lead is unavailable.
      tier_approver:
        type: string
        description: Required for tier `org` or `regulated` — approves tier escalations.

  related_capabilities:
    type: array
    items: { type: string }
    description: |
      Sibling capability IDs that this one interacts with. Helps juniors understand the wider
      surface area without reading every capability file.

  status:
    type: string
    enum: [draft, active, deprecating, retired]
    default: active

# -------------------------------------------------------------------------
# Tier-specific enforcement (validator, not schema)
# -------------------------------------------------------------------------
# tier `local`:   only required:* fields
# tier `team`:    + tasks_must.pass_contract_tests at least 1 entry
# tier `org`:     + evidence_requirements + runtime_constraints.performance + owner.tier_approver
# tier `regulated`: + runtime_constraints.security + status must be `active`
