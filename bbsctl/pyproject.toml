[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "bbsctl"
version = "0.1.1"
description = "Bulbasaur skill framework CLI — design, compile, validate, deploy, and evaluate agent skills like production code."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Bulbasaur framework" }]
requires-python = ">=3.11,<3.14"
keywords = ["agent", "skills", "llm", "agentskills", "claude", "policy", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
]

# Base install — the five-minute promise. Stdlib + ruamel.yaml only.
# Covers: bbsctl new, bbsctl compile, bbsctl run at `local` strictness.
dependencies = [
  "ruamel.yaml>=0.18,<1.0",
]

# Optional dependency groups. Land progressively across phases (see ADR 0003).
[project.optional-dependencies]
# Phase 2: full validator suite (registry-context trigger, prompt-injection, semantic fuzz).
validator = [
  # Pinned in Phase 2 sprint 3.
]

# Phase 4: runtime components (Hook Bus, Cost Budget Enforcer, OTel exporters).
runtime = [
  # Pinned in Phase 4 sprint 1.
  # "opentelemetry-api>=1.27",
  # "opentelemetry-sdk>=1.27",
]

# Phase 3: publishing, signing, MCP Composer federation.
registry = [
  # Pinned in Phase 3 sprint 7.
  # "sigstore>=3.0",
]

# Everything — for CI runners and framework dogfooding.
full = [
  "bbsctl[validator,runtime,registry]",
]

# Development-time tooling — not user-facing.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

# Per ADR 0006: PyPI package name is `bbsctl`; CLI binary is `bbsctl`;
# Python module remains `skillctl` (internal import path, unchanged).
# bbsctl lifecycle is NOT a second binary — it is the lifecycle package behind
# `bbsctl pipeline` / `bbsctl doctor` / `bbsctl approve` / `bbsctl verify`.
[project.scripts]
bbsctl = "skillctl.cli:main"

# PEP 735 — not published to PyPI metadata. `uv sync --group engines`.
[dependency-groups]
engines = [
  "skillspector; python_version >= '3.12'",
  "mellea-skills-compiler",
]

[tool.uv.sources]
skillspector = { git = "https://github.com/NVIDIA/SkillSpector", rev = "cf5cac7ba5c756a6e0ebf52dc9763f49422f889f" }
mellea-skills-compiler = { git = "https://github.com/generative-computing/mellea-skills-compiler", rev = "1538a0870ab9868ff5252c96722ba3827a4345ab" }

[tool.bbsctl]
default_strictness = "team"

[tool.bbsctl.engines]
scan = "bbsctl-audit"
certify = "none"

[tool.bbsctl.engines.mellea]
inference_engine = "ollama"
risk_model = "granite4.1:3b"
guardian_model = "ibm/granite3.3-guardian:8b"
n_fixtures = 3

[project.urls]
Homepage = "https://github.com/mansura-habiba/bulbasaur-skill-cli"
Documentation = "https://github.com/mansura-habiba/bulbasaur-skill-cli/tree/main/docs"
Repository = "https://github.com/mansura-habiba/bulbasaur-skill-cli"
Issues = "https://github.com/mansura-habiba/bulbasaur-skill-cli/issues"
Changelog = "https://github.com/mansura-habiba/bulbasaur-skill-cli/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/skillctl"]
exclude = [
  "**/.fuse_hidden*",  # sandbox FUSE artifacts; never real source files
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.bulbasaur]
version = 1
default_strictness = "team"

[tool.bulbasaur.spec_lint]
local = "skip"
team = "warn"
org = "block"
regulated = "block"
