# Build bbsctl and publish to PyPI (Trusted Publishing).
#
# Triggers:
#   - GitHub Release published → always publish
#   - workflow_dispatch → dry-run build+test by default; set publish_to_pypi=true to push
#   - push of version tags v* → build+test; publish only for tags matching vX.Y.Z
#
# Setup (one-time on PyPI):
#   1. Create GitHub Environment named `pypi` (optional reviewers / wait timer).
#   2. On https://pypi.org/manage/project/bbsctl/settings/publishing/
#      add a Trusted Publisher:
#        Owner: mansura-habiba
#        Repository: bulbasaur-skill-cli
#        Workflow: python-publish.yml
#        Environment: pypi
name: Release Python Package

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish to PyPI after a successful build (off = dry run: build + test only)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bbsctl

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build + test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling pytest

      - name: Install package (editable) + run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q --deselect tests/test_doc_links.py

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Smoke-import the built wheel
        run: |
          python -m pip install dist/*.whl
          bbsctl --version
          python -c "import skillctl; print(skillctl.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: release-dists
          path: bbsctl/dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [release-build]
    # Publish when:
    #   - a GitHub Release is published, or
    #   - workflow_dispatch with publish_to_pypi=true, or
    #   - a semver tag vX.Y.Z (not pre-release suffixes) is pushed
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.publish_to_pypi == 'true') ||
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/tags/v') &&
       !contains(github.ref, '-'))
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/bbsctl

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v5
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
